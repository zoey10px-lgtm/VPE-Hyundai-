# VPE Hyundai infrastructure — adopt the existing Singapore web service and free DB.
# Secrets such as OPENAI_API_KEY remain configured in Render, not in this file.
services:
  - type: web
    name: vpe-hyundai
    runtime: node
    repo: https://github.com/zoey10px-lgtm/VPE-Hyundai-
    branch: main
    region: singapore
    plan: free
    buildCommand: npm install --prefix server --omit=dev
    startCommand: node server/index.mjs
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vpe-hyundai-db
          property: connectionString

databases:
  - name: vpe-hyundai-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
