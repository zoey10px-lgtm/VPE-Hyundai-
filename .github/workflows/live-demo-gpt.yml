name: VPE live GPT demo chat check
on:
  push:
    paths:
      - 'server/live-demo-smoke.mjs'
      - '.github/workflows/live-demo-gpt.yml'
  workflow_dispatch:
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real OpenAI reply and Postgres demo isolation
        run: node server/live-demo-smoke.mjs
