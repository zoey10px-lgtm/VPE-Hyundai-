name: VPE Android UI Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile VPE
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run live Android UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.vpe.hyundai.test/com.vpe.hyundai.UiRegressionInstrumentation > /tmp/vpe-ui-regression.txt
            cat /tmp/vpe-ui-regression.txt
            grep -q UI_REGRESSION_PASS /tmp/vpe-ui-regression.txt
            adb pull /sdcard/Android/data/com.vpe.hyundai/files/ui-report-top.png /tmp/ui-report-top.png
            adb pull /sdcard/Android/data/com.vpe.hyundai/files/ui-report-gauges.png /tmp/ui-report-gauges.png
            adb pull /sdcard/Android/data/com.vpe.hyundai/files/ui-home-cards.png /tmp/ui-home-cards.png
            adb pull /sdcard/Android/data/com.vpe.hyundai/files/ui-trait-evidence.png /tmp/ui-trait-evidence.png
            adb pull /sdcard/Android/data/com.vpe.hyundai/files/ui-name-editor.png /tmp/ui-name-editor.png
            adb pull /sdcard/Android/data/com.vpe.hyundai/files/ui-named-report.png /tmp/ui-named-report.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpe-ui-smoke-diagnostics
          if-no-files-found: ignore
          path: |
            /tmp/vpe-ui-regression.txt
            /tmp/ui-report-top.png
            /tmp/ui-report-gauges.png
            /tmp/ui-home-cards.png
            /tmp/ui-trait-evidence.png
            /tmp/ui-name-editor.png
            /tmp/ui-named-report.png
            /tmp/vpe_frame_1.png
            /tmp/vpe_frame_2.png
            /tmp/vpe_login_screen.png
            /tmp/vpe_signup_screen.png
            /tmp/vpe_demo.png
            /tmp/vpe_chat.png
            /tmp/vpe_diagnostics.png
            /tmp/vpe_runtime_errors.txt
