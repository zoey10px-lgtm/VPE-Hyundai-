name: Pleos Vehicle Service SDK Integration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pleos-vehicle-integration.yml'
jobs:
  vehicle-service:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK against real Pleos Vehicle SDK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Configure official Pleos Connect 2.x system image repository
        shell: bash
        run: |
          set -euo pipefail
          SDK_SITE="https://nexus-playground.pleos.ai/repository/raw-releases/connect-avd/2.x/crp-sys-img.xml"
          mkdir -p "$HOME/.android"
          cat > "$HOME/.android/repositories.cfg" <<EOF
          count=1
          src00=$SDK_SITE
          EOF
          echo "Checking official Pleos Connect SDK system image repository..."
          curl -fLsS --connect-timeout 15 --max-time 45 "$SDK_SITE" -o /tmp/pleos-avd.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/pleos-avd.xml').getroot()
          paths = sorted({x.attrib['path'] for x in root.iter() if x.tag.endswith('remotePackage') and 'path' in x.attrib})
          print('Published Pleos system images:')
          for p in paths: print('  ',p)
          with open('/tmp/pleos-images.txt','w') as f: f.write('\n'.join(paths))
          PY
          test -s /tmp/pleos-images.txt
          sdkmanager --list --verbose > /tmp/sdkmanager-pleos-list.txt
          grep -Ei 'pleos|connect|crp' /tmp/sdkmanager-pleos-list.txt | head -35 || true
      - name: Install Pleos Automotive system image
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=$(grep -E 'system-images;android-34;' /tmp/pleos-images.txt | grep -Ei 'x86_64|x86' | head -1 || true)
          if [ -z "$PACKAGE" ]; then
            echo "::error::Pleos Android API 34 x86 system image not publicly discoverable via official repository."
            exit 1
          fi
          echo "PLEOS_PACKAGE=system-images;android-34;android-automotive;x86_64" >> "$GITHUB_ENV"
          # GitHub command-line sdkmanager does not index Android Studio's custom
          # update site. Install the same official, SHA-1 verified system-image ZIP.
          sdkmanager --install "emulator" "platform-tools" "platforms;android-34"
          python3 - <<'PY' > /tmp/pleos-archive-info.txt
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/pleos-avd.xml').getroot()
          pkg=next(e for e in root.iter() if e.tag.endswith('remotePackage') and
              e.attrib.get('path')=='system-images;android-34;pleos_car_emulator;x86_64')
          archive=next(e for e in pkg.iter() if e.tag.endswith('archive'))
          url=next(e.text for e in archive.iter() if e.tag.endswith('url'))
          checksum=next(e.text for e in archive.iter() if e.tag.endswith('checksum'))
          print(url)
          print(checksum)
          PY
          IMAGE_URL=$(sed -n '1p' /tmp/pleos-archive-info.txt)
          IMAGE_SHA1=$(sed -n '2p' /tmp/pleos-archive-info.txt)
          echo "Downloading official Pleos Connect Android Automotive system image; SHA-1 is validated against official repository XML"
          df -h "$ANDROID_HOME"
          curl --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 \
            --max-time 1400 --progress-bar "$IMAGE_URL" -o /tmp/pleos-official-image.zip
          echo "$IMAGE_SHA1  /tmp/pleos-official-image.zip" | sha1sum -c -
          IMAGE_DIR="$ANDROID_HOME/system-images/android-34/android-automotive/x86_64"
          mkdir -p "$IMAGE_DIR"
          unzip -q /tmp/pleos-official-image.zip -d "$IMAGE_DIR"
          rm /tmp/pleos-official-image.zip
          # The published Pleos archive wraps system.img in crp_avd_out_x86_64.
          # Android tools require system image files directly under the ABI folder.
          if [ -d "$IMAGE_DIR/crp_avd_out_x86_64" ]; then
            mv "$IMAGE_DIR/crp_avd_out_x86_64/"* "$IMAGE_DIR/"
            rmdir "$IMAGE_DIR/crp_avd_out_x86_64"
          fi
          test -f "$IMAGE_DIR/system.img" || { echo "::error::Missing Pleos system.img"; ls -lh "$IMAGE_DIR"; exit 1; }
          cat > "$IMAGE_DIR/source.properties" <<'EOF'
          Pkg.Desc=Pleos Connect v2.1.0 APIs x86_64
          Pkg.Revision=2
          AndroidVersion.ApiLevel=34
          SystemImage.Abi=x86_64
          SystemImage.TagId=android-automotive
          SystemImage.TagDisplay=Pleos Connect v2.1.0 APIs
          SystemImage.VendorId=pleos
          SystemImage.VendorDisplay=Pleos Connect v2.1.0
          EOF
          echo "Installed image files:"
          ls -lh "$IMAGE_DIR" | head -25
          avdmanager create avd --force -n "VPE_Pleos_Connect" -k "system-images;android-34;android-automotive;x86_64" \
            -d "automotive_1024p_landscape" <<<'no'
      - name: Boot Pleos Vehicle Service emulator and exercise SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "Starting Pleos system image with verbose emulator log..."
          "$ANDROID_HOME/emulator/emulator" -avd "VPE_Pleos_Connect" -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 4096 -verbose > /tmp/pleos-emulator.log 2>&1 &
          EMULATOR_PID=$!
          if ! timeout 150 adb wait-for-device; then
            echo "::error::Pleos AVD did not appear in adb within 150 seconds"
            tail -120 /tmp/pleos-emulator.log || true
            exit 1
          fi
          BOOTED=0
          for i in $(seq 1 48); do
            if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              BOOTED=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "::error::Pleos emulator process terminated during boot"
              break
            fi
            sleep 5
          done
          if [ "$BOOTED" -ne 1 ]; then
            echo "::error::Pleos AVD did not finish booting. Inspect pleos-emulator.log artifact."
            adb devices -l || true
            tail -120 /tmp/pleos-emulator.log || true
            exit 1
          fi
          echo "Pleos emulator boot completed"
          adb shell pm list features | tee /tmp/pleos-features.txt
          grep -q 'android.hardware.type.automotive' /tmp/pleos-features.txt
          adb shell pm list permissions -f | grep -Ei 'pleos.car.permission' | head -30 || true
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n com.vpe.hyundai/.MainActivity
          sleep 5
          adb shell uiautomator dump /sdcard/window.xml
          adb exec-out cat /sdcard/window.xml > /tmp/pleos-vpe-ui.xml
          python3 - <<'PY'
          import re, subprocess, xml.etree.ElementTree as ET
          root=ET.parse('/tmp/pleos-vpe-ui.xml').getroot()
          for node in root.iter():
              if 'Pleos 차량 연결하기' in node.attrib.get('text',''):
                  vals=list(map(int,re.findall(r'\d+',node.attrib['bounds'])))
                  subprocess.check_call(['adb','shell','input','tap',str((vals[0]+vals[2])//2),str((vals[1]+vals[3])//2)])
                  break
          else:
              raise SystemExit('VPE real SDK connect button not found on Pleos device')
          PY
          sleep 15
          adb logcat -d -s VPE_PLEOS:I > /tmp/vpe-pleos-real-sdk.log
          cat /tmp/vpe-pleos-real-sdk.log
          if ! grep -Eq 'ODO_OK|FUEL_OK|EV_OK|VIN_OK' /tmp/vpe-pleos-real-sdk.log; then
            echo "::error::No successful vehicle property response from real Pleos Vehicle Service."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pleos-real-sdk-diagnostics
          if-no-files-found: ignore
          path: |
            /tmp/pleos-avd.xml
            /tmp/pleos-images.txt
            /tmp/sdkmanager-pleos-list.txt
            /tmp/pleos-emulator.log
            /tmp/pleos-features.txt
            /tmp/vpe-pleos-ui.xml
            /tmp/vpe-pleos-real-sdk.log
